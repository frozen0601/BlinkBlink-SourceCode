<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>About</title>
        <link rel="stylesheet" href="about.css" />
    </head>
    <body>
        <div class="about-container">
            <img src="icon.png" alt="BlinkBlink Logo" class="logo" />
            <h1>BlinkBlink</h1>
            <p class="version">
                <span id="version"></span>
            </p>
            <button class="update-button" id="update-button"></button>
            <div class="separator"></div>
            <div class="info-container">
                <p><strong>Description</strong> <span id="description"></span></p>
                <p><strong>License</strong> <span id="license"></span></p>
                <p><strong>Website</strong> <a id="website" href="#" target="_blank"></a></p>
                <p><strong>Support</strong> <a id="support" href="#"></a></p>
            </div>
            <p class="author"><span id="author"></span></p>
            <p><a href="https://2ly.link/216p3" target="_blank" class="buy-me-coffee">Buy Me a Coffee</a></p>
            <p><a href="https://2ly.link/216p4" target="_blank" class="ko-fi">Support on Ko-fi</a></p>
            <p><a href="https://2ly.link/216p8" target="_blank" class="paypal">Donate via PayPal</a></p>
        </div>
        <script>
            window.api.getAppInfo().then((appInfo) => {
                document.getElementById('version').innerText = appInfo.version
                document.getElementById('author').innerText = `BlinkBlink © ${new Date().getFullYear()}`
                document.getElementById('description').innerText = appInfo.description
                document.getElementById('license').innerText = appInfo.license
                const websiteLink = document.getElementById('website')
                websiteLink.href = appInfo.website
                websiteLink.innerText = 'BlinkBlink Website'
                const supportLink = document.getElementById('support')
                supportLink.href = `mailto:${appInfo.supportEmail}`
                supportLink.innerText = appInfo.supportEmail
            })

            const updateButton = document.getElementById('update-button')
            updateButton.innerText = 'Check for updates'
            updateButton.addEventListener('click', () => {
                updateButton.innerText = 'Checking...'
                window.api
                    .checkForUpdates()
                    .then((result) => {
                        if (result && result.updateInfo) {
                            updateButton.innerText = 'Update available'
                        } else {
                            updateButton.innerText = 'Up-to-date ✔'
                        }
                    })
                    .catch(() => {
                        updateButton.innerText = 'Check for updates'
                    })
            })

            document.getElementById('website').addEventListener('click', (event) => {
                event.preventDefault()
                window.api.openExternal(event.target.href)
            })

            const buyMeCoffeeButton = document.querySelector('.buy-me-coffee')
            buyMeCoffeeButton.addEventListener('click', (event) => {
                event.preventDefault()
                window.api.openExternal(event.target.href)
            })

            const koFiButton = document.querySelector('.ko-fi')
            koFiButton.addEventListener('click', (event) => {
                event.preventDefault()
                window.api.openExternal(event.target.href)
            })

            const paypalButton = document.querySelector('.paypal')
            paypalButton.addEventListener('click', (event) => {
                event.preventDefault()
                window.api.openExternal(event.target.href)
            })
        </script>
    </body>
</html>

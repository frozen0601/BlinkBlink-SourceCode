<!-- stats.html -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Break Stats</title>
        <link rel="stylesheet" href="stats.css" />
    </head>
    <body>
        <div class="stats-container">
            <div class="stat-group">
                <h2>Current Consecutive Streak</h2>
                <div class="stat-item">
                    <p>Count: <span id="break-streak-count"></span></p>
                    <p>Total Protection: <span id="break-streak-duration"></span></p>
                    <p>Started at: <span id="current-work-streak-start-time"></span></p>
                </div>
            </div>

            <div class="stat-group">
                <h2>Longest Consecutive Streak</h2>
                <div class="stat-item">
                    <p>Count: <span id="highest-streak-count"></span></p>
                    <p>Total Protection: <span id="highest-streak-duration"></span></p>
                    <p>Started at: <span id="highest-streak-start-time"></span></p>
                    <p>Ended at: <span id="highest-streak-end-time"></span></p>
                </div>
            </div>
        </div>
        <script>
            const { ipcRenderer } = require('electron')
            const { formatDuration, intervalToDuration } = require('date-fns')

            ipcRenderer.invoke('get-stats').then((stats) => {
                // Current streak
                document.getElementById('break-streak-count').textContent = stats.breakStreakCount || '0'
                document.getElementById('break-streak-duration').textContent = formatTime(stats.breakStreakDuration)
                document.getElementById('current-work-streak-start-time').textContent = stats.streakStartTime
                    ? new Date(stats.streakStartTime).toLocaleString()
                    : 'Not started'

                // Highest streak
                document.getElementById('highest-streak-count').textContent = stats.highestStreakCount || '0'
                document.getElementById('highest-streak-duration').textContent = formatTime(stats.highestStreakDuration)
                document.getElementById('highest-streak-start-time').textContent = stats.highestStreakStartTime
                    ? new Date(stats.highestStreakStartTime).toLocaleString()
                    : 'No streak yet'
                document.getElementById('highest-streak-end-time').textContent = stats.highestStreakEndTime
                    ? new Date(stats.highestStreakEndTime).toLocaleString()
                    : 'No streak yet'
            })

            function formatTime(ms) {
                if (!ms) return '0 second'
                const duration = intervalToDuration({ start: 0, end: ms })
                if (duration.days > 0) {
                    return `${duration.days} ${duration.days === 1 ? 'day' : 'days'}${
                        duration.hours ? ` ${duration.hours === 1 ? 'hour' : 'hours'}` : ''
                    }`
                }

                if (duration.hours > 0) {
                    return `${duration.hours} ${duration.hours === 1 ? 'hour' : 'hours'}${
                        duration.minutes ? ` ${duration.minutes === 1 ? 'minute' : 'minutes'}` : ''
                    }`
                }

                if (duration.minutes > 0) {
                    return `${duration.minutes} ${duration.minutes === 1 ? 'minute' : 'minutes'}`
                }

                return `${duration.seconds} ${duration.seconds === 1 ? 'second' : 'seconds'}`
            }
        </script>
    </body>
</html>

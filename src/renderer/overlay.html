<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: file:; media-src 'self' file:"
        />
        <title>BlinkBlink</title>
        <link rel="stylesheet" href="overlay.css" />
    </head>
    <body>
        <!-- Break view -->
        <div id="break-view">
            <div class="content-container">
                <h1>Take A Break <img id="eye-animation" src="rolling_eyes.gif" alt="" /></h1>
                <p class="subtitle">Look at something about 20 feet away.</p>
                <div id="countdown-label" class="countdown-label" aria-live="polite"></div>
                <div id="warning-text">This action will reset your streak. Click again to confirm.</div>
                <button id="skip-button" type="button">Skip</button>
            </div>
        </div>

        <!-- Summary view -->
        <div id="summary-view">
            <div class="content-container">
                <h1>Well Done</h1>
                <div class="central-circle-container">
                    <div id="central-circle" class="central-circle">
                        <span class="number"></span>
                        <span class="text">Current Streak</span>
                    </div>
                </div>
                <div id="progress-tracker"></div>
                <button id="dismiss-button" class="dismiss-button" type="button">
                    <span>Dismiss</span>
                    <div class="progress-bar"></div>
                </button>
                <div id="progress-bar" class="progress"></div>
            </div>
        </div>
        <script src="overlay.js"></script>
    </body>
</html>

<!-- src/dashboard.html -->
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Dashboard</title>
        <style>
            .content-container {
                opacity: 0;
                transition: opacity 0.3s ease-out;
            }
            .ready .content-container {
                opacity: 1;
            }
        </style>
        <link rel="stylesheet" href="dashboard.css" />
    </head>
    <body>
        <div class="content-container">
            <h1>Well Done</h1>
            <div class="central-circle-container">
                <div id="central-circle" class="central-circle">
                    <span class="number"></span>
                    <span class="text">Current Streak</span>
                </div>
            </div>
            <div id="progress-tracker"></div>
            <button id="dismiss-button">
                Dismiss
                <div class="progress"></div>
            </button>
        </div>
        <script src="dashboard.js"></script>
    </body>
</html>

<!-- src/overlay.html -->
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Break Time</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: rgba(0, 0, 0, 0.5);
                color: white;
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            h1 {
                font-size: 48px;
                margin-bottom: 20px;
            }
            p {
                font-size: 24px;
                margin-bottom: 40px;
            }
            #message {
                font-size: 24px;
                margin-bottom: 20px;
            }
            #countdown {
                font-size: 48px;
                margin-bottom: 20px;
            }
            #skip-button {
                padding: 10px 20px;
                font-size: 18px;
                cursor: pointer;
                background: rgba(255, 255, 255, 0.2);
                border: none;
                color: white;
                border-radius: 5px;
                transition: background 0.3s;
            }
            #skip-button:hover {
                background: rgba(255, 255, 255, 0.3);
            }
        </style>
    </head>
    <body>
        <div id="message">Rest your eyes for 20 seconds!</div>
        <div id="countdown">20</div>
        <button id="skip-button">Skip Break</button>
        <script>
            const { ipcRenderer } = require('electron')

            ipcRenderer.on('countdown-update', (event, countdown) => {
                document.getElementById('countdown').textContent = countdown.toString()
            })

            document.getElementById('skip-button').addEventListener('click', () => {
                ipcRenderer.send('break-skip') // Notify main process
                window.close()
            })
        </script>
    </body>
</html>

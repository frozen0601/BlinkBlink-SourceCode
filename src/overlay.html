<!-- src/overlay.html -->
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Break Time</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: rgba(0, 0, 0, 0.5);
                color: white;
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                position: relative;
            }
            .content-container {
                width: 80%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 2vh 0;
            }
            h1 {
                font-size: 4vw;
                margin-top: 30vh;
                margin-bottom: 30vh;
            }
            #countdown {
                font-size: 3vw;
                margin-bottom: 60vh;
            }
            #eye-animation {
                width: 4vw;
                height: 4vw;
                /* margin-bottom: 30vh; */
            }
            #warning-text {
                display: none;
                color: darkred;
                background: rgba(255, 255, 255, 0.8);
                padding: 0.5vh 1vw;
                border-radius: 5px;
                font-size: 1vw;
                text-align: center;
                position: absolute;
                bottom: 10vh;
            }
            #skip-button {
                position: absolute;
                bottom: 5vh;
                padding: 0.5vh 1vw;
                font-size: 0.8vw;
                cursor: pointer;
                background: rgba(255, 255, 255, 0.1);
                border: none;
                color: rgba(255, 255, 255, 0.7);
                border-radius: 5px;
                transition: background 0.3s, color 0.3s;
            }
            #skip-button:hover {
                background: rgba(255, 255, 255, 0.2);
                color: rgba(255, 255, 255, 1);
            }
        </style>
    </head>
    <body>
        <div class="content-container">
            <h1>Look Away <img id="eye-animation" src="../assets/rolling_eyes.gif" alt="Eye Animation" /></h1>
            <!-- <div id="countdown"></div> -->
            <div id="warning-text">This action will reset your streak. Click again to confirm.</div>
            <button id="skip-button">Skip</button>
        </div>
        <script>
            const { ipcRenderer } = require('electron')
            let skipConfirmed = false

            ipcRenderer.on('countdown-update', (event, countdown) => {
                document.getElementById('countdown').textContent = countdown.toString()
            })

            document.getElementById('skip-button').addEventListener('click', () => {
                if (!skipConfirmed) {
                    document.getElementById('warning-text').style.display = 'block'
                    document.getElementById('skip-button').textContent = 'Confirm'
                    skipConfirmed = true
                } else {
                    ipcRenderer.send('break-skip')
                    window.close()
                }
            })
        </script>
    </body>
</html>

<!-- src/overlay.html -->
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Break Time</title>
        <style>
            /* Add your styles here */
            body {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                color: white;
                font-family: Arial, sans-serif;
            }
            #message {
                font-size: 24px;
                margin-bottom: 20px;
            }
            #countdown {
                font-size: 48px;
                margin-bottom: 20px;
            }
            #skip-button {
                padding: 10px 20px;
                font-size: 18px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div id="message">Rest your eyes for 20 seconds!</div>
        <div id="countdown">20</div>
        <button id="skip-button">Skip Break</button>
        <script>
            const { ipcRenderer } = require('electron')

            let countdown = 20
            const countdownElement = document.getElementById('countdown')

            const interval = setInterval(() => {
                countdown -= 1
                countdownElement.textContent = countdown.toString()
                if (countdown <= 0) {
                    clearInterval(interval)
                    ipcRenderer.send('break-complete') // Notify main process
                    window.close()
                }
            }, 1000)

            document.getElementById('skip-button').addEventListener('click', () => {
                clearInterval(interval)
                ipcRenderer.send('break-skip') // Notify main process
                window.close()
            })
        </script>
    </body>
</html>

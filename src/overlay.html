<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Break Time</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: black;
                backdrop-filter: blur(15px);
                -webkit-backdrop-filter: blur(15px); /* For better browser support */
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                color: white;
                font-size: 24px;
            }
            #message {
                margin-bottom: 20px;
                text-align: center;
            }
            #countdown {
                margin-bottom: 40px;
                font-size: 48px;
            }
            #skip-button {
                position: absolute;
                bottom: 40px;
                right: 40px;
                padding: 10px 20px;
                font-size: 18px;
                cursor: pointer;
                border: none;
                border-radius: 5px;
                background-color: rgba(255, 255, 255, 0.3);
                color: white;
                transition: background-color 0.3s;
            }
            #skip-button:hover {
                background-color: rgba(255, 255, 255, 0.5);
            }
        </style>
    </head>
    <body>
        <div id="message">Rest your eyes for 20 seconds!</div>
        <div id="countdown">20</div>
        <button id="skip-button">Skip Break</button>
        <script>
            const { ipcRenderer } = require('electron')

            let countdown = 20
            const countdownElement = document.getElementById('countdown')
            const interval = setInterval(() => {
                countdown -= 1
                countdownElement.textContent = countdown.toString()
                if (countdown <= 0) {
                    clearInterval(interval)
                    ipcRenderer.send('break-ended')
                    window.close()
                }
            }, 1000)

            document.getElementById('skip-button').addEventListener('click', () => {
                clearInterval(interval)
                ipcRenderer.send('break-ended')
                window.close()
            })
        </script>
    </body>
</html>

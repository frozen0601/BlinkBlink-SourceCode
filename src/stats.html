<!-- stats.html -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Break Stats</title>
        <link rel="stylesheet" href="stats.css" />
    </head>
    <body>
        <h1>BlinkBlink Stats</h1>
        <div class="stats-container">
            <div class="stat-item">
                <p>
                    You've consecutively rested your eyes
                    <span id="break-streak-count"></span> times, which is <span id="break-streak-duration"></span> of eye protection.
                </p>
            </div>
            <div class="stat-item">
                <p>
                    Your last break ended at <span id="last-break-end-time"></span>.
                </p>
            </div>
            <div class="stat-item">
                <p>
                    Your current work streak started at <span id="current-work-streak-start-time"></span>.
                </p>
            </div>
        </div>
        <style>
            body {
                padding: 20px;
                max-width: 800px;
                width: 100%;
            }
        </style>
        <script>
            const { ipcRenderer } = require('electron')
            const { formatDuration, intervalToDuration } = require('date-fns')
            ipcRenderer.invoke('get-stats').then((stats) => {
                document.getElementById('break-streak-count').textContent = stats.breakStreakCount
                document.getElementById('break-streak-duration').textContent = formatTime(stats.breakStreakDuration)
                document.getElementById('last-break-end-time').textContent = new Date(stats.lastBreakEndTime).toLocaleString()
                document.getElementById('current-work-streak-start-time').textContent = new Date(stats.currentWorkStreakStartTime).toLocaleString()
            })

            function formatTime(ms) {
                if (!ms) return '0 second'
                const duration = intervalToDuration({ start: 0, end: ms })
                if (duration.days > 0) {
                    return `${duration.days} ${duration.days === 1 ? 'day' : 'days'}${
                        duration.hours ? ` ${duration.hours} ${duration.hours === 1 ? 'hour' : 'hours'}` : ''
                    }`
                }

                if (duration.hours > 0) {
                    return `${duration.hours} ${duration.hours === 1 ? 'hour' : 'hours'}${
                        duration.minutes ? ` ${duration.minutes} ${duration.minutes === 1 ? 'minute' : 'minutes'}` : ''
                    }`
                }

                if (duration.minutes > 0) {
                    return `${duration.minutes} ${duration.minutes === 1 ? 'minute' : 'minutes'}`
                }

                return `${duration.seconds} ${duration.seconds === 1 ? 'second' : 'seconds'}`
            }
        </script>
    </body>
</html>

<!-- src/dashboard.html -->
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Dashboard</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: rgba(0, 0, 0, 0.5);
                color: white;
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            h1 {
                font-size: 48px;
                margin-bottom: 20px;
            }
            p {
                font-size: 24px;
                margin-bottom: 40px;
            }
            #dismiss-button {
                padding: 10px 20px;
                font-size: 18px;
                cursor: pointer;
                background: rgba(255, 255, 255, 0.2);
                border: none;
                color: white;
                border-radius: 5px;
                transition: background 0.3s;
            }
            #dismiss-button:hover {
                background: rgba(255, 255, 255, 0.3);
            }
        </style>
    </head>
    <body>
        <h1>Good Job!</h1>
        <p>
            You've consecutively rested your eyes
            <span id="break-count">0</span> times, which is <span id="eye-protection-time">0</span> minutes of eye protection.
        </p>
        <button id="dismiss-button">Continue in <span id="dismiss-countdown">5</span>s</button>
        <script>
            const { ipcRenderer } = require('electron')

            // Single handler for all countdown updates
            ipcRenderer.on('countdown-update', (event, countdown) => {
                document.getElementById('dismiss-countdown').textContent = countdown.toString()
            })

            document.getElementById('dismiss-button').addEventListener('click', () => {
                ipcRenderer.send('dashboard-dismissed')
                window.close()
            })
        </script>
    </body>
</html>

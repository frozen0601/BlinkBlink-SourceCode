<!-- src/dashboard.html -->
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Dashboard</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: rgba(0, 0, 0, 0.5);
                color: white;
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                position: relative;
            }
            .content-container {
                width: 80%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 2vh 0;
            }
            h1 {
                font-size: 4vw;
                margin: 2vh 0;
            }
            /* Progress Tracker Styles */
            #progress-tracker {
                display: flex;
                gap: 20px;
                justify-content: center;
                margin: 20px 0;
            }

            .circle {
                width: 5vh;
                height: 5vh;
                border: 2px solid #ccc;
                border-radius: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 1.2rem;
                color: #ccc;
                transition: background-color 0.3s, border-color 0.3s, color 0.3s;
            }

            .circle.filled {
                background-color: #4caf50;
                border-color: #4caf50;
                color: white;
            }
            .central-circle-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-bottom: 3vh;
            }
            .central-circle {
                width: 10vh;
                height: 10vh;
                border: 3px solid #4caf50;
                border-radius: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 2.4rem;
                font-weight: bold;
                color: #4caf50;
                background-color: rgba(0, 0, 0, 0.5);
                position: relative;
                cursor: pointer;
            }

            .central-circle .number {
                transition: opacity 0.3s ease-in-out;
            }

            .central-circle .text {
                position: absolute;
                font-size: 1.2rem;
                color: #fff;
                text-align: center;
                opacity: 0;
                transition: opacity 0.3s ease-in-out;
                pointer-events: none;
            }

            .central-circle:hover .number {
                opacity: 0;
            }

            .central-circle:hover .text {
                opacity: 1;
            }
            #dismiss-button {
                padding: 10px 20px;
                font-size: 18px;
                cursor: pointer;
                background: rgba(255, 255, 255, 0.2);
                border: none;
                color: white;
                border-radius: 5px;
                transition: background 0.3s;
            }
            #dismiss-button:hover {
                background: rgba(255, 255, 255, 0.3);
            }
            /* Responsive Adjustments */
            @media (max-width: 600px) {
                .circle {
                    width: 40px;
                    height: 40px;
                    font-size: 1rem;
                }

                .central-circle {
                    width: 60px;
                    height: 60px;
                    font-size: 3rem;
                    top: -30px; /* Adjust position for smaller screens */
                }

                h1 {
                    font-size: 4vw;
                }
            }
            @keyframes milestone-hit {
                0% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(1.3);
                    background-color: #4caf50;
                    border-color: #4caf50;
                    color: white;
                }
                100% {
                    transform: scale(1);
                }
            }

            @keyframes next-milestone-blink {
                0% {
                    border-color: #ccc;
                }
                50% {
                    border-color: #4caf50;
                    color: #4caf50;
                }
                100% {
                    border-color: #ccc;
                }
            }

            .circle.milestone-hit {
                animation: milestone-hit 1s ease-in-out infinite;
            }

            .circle.next-milestone {
                animation: next-milestone-blink 2s ease-in-out infinite;
            }
        </style>
    </head>
    <body>
        <div class="content-container">
            <h1>Good Job 😌</h1>
            <div class="central-circle-container">
                <div id="central-circle" class="central-circle">
                    <span class="number"></span>
                    <span class="text">Current Streak</span>
                </div>
            </div>
            <div id="progress-tracker">
                <!-- Circles will be added dynamically -->
            </div>
            <button id="dismiss-button">Dismiss in <span id="dismiss-countdown"></span>s</button>
        </div>
        <script>
            const { ipcRenderer } = require('electron')
            const { formatDuration, intervalToDuration } = require('date-fns')

            function calculateMilestones(currentStreak) {
                const baseMilestones = [5, 10, 20, 50]

                if (currentStreak <= 50) {
                    return baseMilestones
                }

                if (currentStreak <= 150) {
                    return [75, 100, 125, 150]
                }

                const baseNumber = Math.floor(currentStreak / 100) * 100
                return [100, 150, 200, 250].map((offset) => baseNumber + offset)
            }

            function updateProgressTracker(count) {
                const progressTracker = document.getElementById('progress-tracker')
                const milestones = calculateMilestones(count)

                // Find next milestone
                const nextMilestone = milestones.find((m) => m > count) || null

                progressTracker.innerHTML = ''
                milestones.forEach((threshold) => {
                    const circle = document.createElement('div')
                    let className = 'circle'

                    if (count === threshold) {
                        // Exact milestone hit
                        className += ' milestone-hit'
                    } else if (count > threshold) {
                        // Past milestone
                        className += ' filled'
                    } else if (threshold === nextMilestone) {
                        // Next milestone to achieve
                        className += ' next-milestone'
                    }

                    circle.className = className
                    circle.setAttribute('data-threshold', threshold)
                    circle.textContent = threshold
                    progressTracker.appendChild(circle)
                })

                document.getElementById('central-circle').querySelector('.number').textContent = count
            }

            // Fetch stats and update UI
            ipcRenderer.invoke('get-stats').then((stats) => {
                updateProgressTracker(stats.breakStreakCount)
            })

            // update countdown every second
            ipcRenderer.on('countdown-update', (event, countdown) => {
                document.getElementById('dismiss-countdown').textContent = countdown.toString()
            })
            // display break stats
            ipcRenderer.invoke('get-stats').then((stats) => {
                document.getElementById('break-streak-count').textContent = stats.breakStreakCount
                document.getElementById('break-streak-duration').textContent = formatTime(stats.breakStreakDuration)
            })

            document.getElementById('dismiss-button').addEventListener('click', () => {
                ipcRenderer.send('dashboard-dismissed')
                window.close()
            })

            function formatTime(ms) {
                if (!ms) return '0 second'
                const duration = intervalToDuration({ start: 0, end: ms })
                if (duration.days > 0) {
                    return `${duration.days} ${duration.days === 1 ? 'day' : 'days'}${
                        duration.hours ? ` ${duration.hours} ${duration.hours === 1 ? 'hour' : 'hours'}` : ''
                    }`
                }

                if (duration.hours > 0) {
                    return `${duration.hours} ${duration.hours === 1 ? 'hour' : 'hours'}${
                        duration.minutes ? ` ${duration.minutes} ${duration.minutes === 1 ? 'minute' : 'minutes'}` : ''
                    }`
                }

                if (duration.minutes > 0) {
                    return `${duration.minutes} ${duration.minutes === 1 ? 'minute' : 'minutes'}`
                }

                return `${duration.seconds} ${duration.seconds === 1 ? 'second' : 'seconds'}`
            }
        </script>
    </body>
</html>

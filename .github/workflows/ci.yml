name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Electron's binary is only needed by the packaging and e2e jobs.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test

  e2e:
    name: End-to-end (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install the libraries Electron needs on a headless runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libgtk-3-0 libnotify4

      - name: Run the Electron end-to-end suite
        run: npm run test:e2e:headless

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  package:
    name: Package smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # electron-builder only packages what webpack has already emitted into
      # dist/; without this it fails with "Application entry file dist/main.js
      # does not exist".
      - name: Compile
        run: npm run build

      # `--dir` produces an unpacked app without building installers, which is
      # enough to catch a broken build config on every platform in about a
      # minute, without needing the installer toolchains.
      - name: Build an unpacked app
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Check the app was actually produced
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d release ]; then
            echo "::error::electron-builder produced no release directory"
            exit 1
          fi
          find release -maxdepth 2 -name '*unpacked*' -o -maxdepth 2 -name '*.app' | head

      # Only a real package exercises the asar layout and process.resourcesPath,
      # where the notification sounds live. A wrong `files` entry shows up here
      # and nowhere else.
      - name: Smoke test the packaged app (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libnss3 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libgtk-3-0 libnotify4
          BLINKBLINK_PACKAGED_PATH=release/linux-unpacked/blinkblink \
            xvfb-run -a --server-args="-screen 0 1600x1000x24" \
            npx playwright test tests/e2e/packaged.spec.ts

      - name: Smoke test the packaged app (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          APP=$(find release -maxdepth 2 -name '*.app' | head -n1)
          BLINKBLINK_PACKAGED_PATH="$APP/Contents/MacOS/BlinkBlink" \
            npx playwright test tests/e2e/packaged.spec.ts

      - name: Smoke test the packaged app (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          BLINKBLINK_PACKAGED_PATH="release/win-unpacked/BlinkBlink.exe" \
            npx playwright test tests/e2e/packaged.spec.ts
